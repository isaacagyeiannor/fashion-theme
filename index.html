<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Theme | Studio Lookbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="canvas">
      <header class="topbar">
        <button class="icon-button" aria-label="Open menu">☰</button>
        <div class="brand">STUDIO</div>
        <nav class="nav">
          <a class="active" href="#">New</a>
          <a href="#">Sale</a>
          <a href="#">Man</a>
          <a href="#">Women</a>
        </nav>
        <button class="search-pill">
          <span>Search</span>
          <span class="icon">⌕</span>
        </button>
        <div class="topbar-icons">
          <button class="icon-button" aria-label="Wishlist">♡</button>
          <button class="icon-button" aria-label="Profile">☺</button>
        </div>
      </header>

      <main class="layout">
        <section class="hero">
          <p class="season" id="season">SPRING / SUMMER 2024</p>
          <h1 id="title">Tied green V-neck shirt</h1>
          <p class="description" id="description">
            Lightweight linen with a soft satin tie. Designed to float between minimal tailoring
            and playful street energy.
          </p>
          <button class="cta">Shop the look</button>

          <div class="socials">
            <button class="icon-pill">f</button>
            <button class="icon-pill">◎</button>
            <button class="icon-pill">⧉</button>
          </div>

          <div class="hero-image">
            <div class="orbit"></div>
            <img
              id="heroImage"
              src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=900&q=80"
              alt="Model wearing tied green shirt"
            />
            <button class="hotspot" aria-label="Highlight detail">+</button>
          </div>
        </section>

        <aside class="products">
          <div class="product-card" id="productOne">
            <div class="product-text">
              <h3>Medium crossbody bag</h3>
              <p>$54</p>
            </div>
            <img
              src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?auto=format&fit=crop&w=220&q=80"
              alt="Crossbody bag"
            />
          </div>
          <div class="product-card" id="productTwo">
            <div class="product-text">
              <h3>High heel sandals</h3>
              <p>$89</p>
            </div>
            <img
              src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=220&q=80"
              alt="High heel sandals"
            />
          </div>

          <div class="carousel">
            <button class="circle-button" id="prevBtn" aria-label="Previous look">‹</button>
            <button class="circle-button" id="nextBtn" aria-label="Next look">›</button>
          </div>
        </aside>

        <aside class="runway">
          <div class="runway-frame">
            <img
              id="sideImage"
              src="https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=520&q=80"
              alt="Runway look"
            />
          </div>
          <span class="runway-label">SUMMER 2020</span>
          <button class="size-guide">Size guide</button>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
